[project]
name = "alphalens-core"
version = "0.1.0"
description = "Shared business logic for AlphaLens (ingestion, RAG, extraction, signals)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_core"]
