[project]
name = "alphalens-core"
version = "0.1.0"
description = "Shared business logic for AlphaLens (ingestion, RAG, extraction, signals)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "sqlglot>=25",
]

[project.scripts]
alphalens = "alphalens_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphalens_core"]
