      - item: "1"
        contains: 167,000 full-time equivalent employees

  - id: rd-spend
    question: How much did Apple spend on research and development in 2026?
    tickers: [AAPL]
    tags: [table]
    relevant:
      - item: "7"
        contains: "45,765"
      - item: "8"
        contains: "45,765"

  - id: ai-competition-risk
    question: Could Apple fall behind competitors in AI?
    tickers: [AAPL]
