# Retrieval golden set: Apple FY2026 10-K (accession 0000320193-26-000026).
#
# A case passes at k if any of the top-k chunks matches ANY `relevant` label:
#   chunk.item_code == item  AND  `contains` appears in the chunk text
# (comparison ignores case, whitespace and curly vs straight quotes).
#
# Label with a phrase that answers the question and is specific enough that it does
# not appear in unrelated chunks. Check a phrase before adding it:
#   uv run alphalens eval-retrieval --check-labels
#
# tags: paraphrase = question wording differs from the filing (tests vector search)
#       exact      = names a specific term (tests keyword search)
#       table      = answer is a number in a table (flattened as "a | b | c" in W1)

cases:
  - id: supply-final-assembly
    question: Where does Apple do the final assembly of its hardware?
    tickers: [AAPL]
    tags: [paraphrase]
    relevant:
      - item: "1A"
        contains: final assembly of substantially all

  - id: supply-single-source
    question: Does Apple depend on any single suppliers for its components?
    tickers: [AAPL]
    tags: [paraphrase]
    relevant:
      - item: "1A"
        contains: certain components from single or limited sources

  - id: legal-dma
    question: What is the EU Digital Markets Act investigation about?
    tickers: [AAPL]
    tags: [exact]
    relevant:
      - item: "3"
        contains: formal noncompliance investigation

  - id: cyber-owner
    question: Who is responsible for managing cybersecurity risk at Apple?
    tickers: [AAPL]
    tags: [paraphrase]
    relevant:
      - item: "1C"
        contains: Head of Corporate Information Security

  - id: fiscal-year
    question: When does Apple's fiscal year end?
