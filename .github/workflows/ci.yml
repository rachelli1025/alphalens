name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, migrate, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as infra/docker-compose.yml
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: alphalens
          POSTGRES_PASSWORD: alphalens
          POSTGRES_DB: alphalens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alphalens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://alphalens:alphalens@localhost:5432/alphalens
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Apply migrations to a fresh database
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest

  airflow:
    name: Airflow DAG import test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Test DAGs inside the real Airflow image so CI matches what runs in production.
      - name: Build Airflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: airflow/Dockerfile
          tags: alphalens-airflow:ci
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: DagBag test
        run: |
          docker run --rm \
            -v "$PWD/airflow:/opt/alphalens/airflow:ro" \
            alphalens-airflow:ci \
            bash -c "pip install --quiet pytest && python -m pytest -p no:cacheprovider /opt/alphalens/airflow/tests"

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: apps/api/Dockerfile
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
