[project]
name = "alphalens-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alphalens-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
